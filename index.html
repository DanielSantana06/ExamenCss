<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Daniel Fernando Santana Gallego">
    <meta name="description" content="Landing page de Ultras">
    <meta name="keywords" content="Ultras, Ropa, HTML, CSS, BEM">
    <title>Ultras. Casual Wear Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Top Bar -->
    <div class="top-bar border-bottom d-none d-md-block py-2">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-4 top-bar__contact">
                    <span class="top-bar__text text-muted">Let's talk!</span>
                    <span class="top-bar__text top-bar__text--bold fw-bold">+57 444 11 00 35</span>
                </div>
                <div class="col-md-4 text-center top-bar__promo">
                    <span class="top-bar__text text-muted">Free shipping on a purchase value of $200</span>
                </div>
                <div class="col-md-4 text-end top-bar__icons">
                    <i class="bi bi-person ms-3 text-muted"></i>
                    <i class="bi bi-cart ms-3 text-muted"></i>
                    <i class="bi bi-heart ms-3 text-muted"></i>
                    <i class="bi bi-search ms-3 text-muted"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white py-4 navbar-custom">
        <div class="container">
            <a class="navbar-brand logo" href="#">
                <h1 class="logo__title fw-bold mb-0">Ultras.</h1>
                <span class="logo__subtitle text-muted">Casual Wear Store</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav nav-menu">
                    <li class="nav-item nav-menu__item"><a class="nav-link nav-menu__link" href="#">Home</a></li>
                    <li class="nav-item nav-menu__item"><a class="nav-link nav-menu__link" href="#">About</a></li>
                    <li class="nav-item nav-menu__item"><a class="nav-link nav-menu__link" href="#">Shop</a></li>
                    <li class="nav-item nav-menu__item"><a class="nav-link nav-menu__link" href="#">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <button class="hero__nav hero__nav--prev border-0 bg-white shadow-sm"><i class="bi bi-chevron-left"></i></button>
    <button class="hero__nav hero__nav--next border-0 bg-white shadow-sm"><i class="bi bi-chevron-right"></i></button>

    <!-- Hero Section -->
    <section class="hero position-relative d-flex align-items-center">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6 hero__content position-relative z-2">
                    <h2 class="hero__title fw-bolder text-dark display-2">Summer<br>Collection</h2>
                    <p class="hero__description text-muted mt-4 w-75">
                        Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed eu feugiat amet.
                    </p>
                </div>
                <div class="col-md-6 hero__image-wrapper text-center">
                    <img src="chica-rosa.jpg" alt="Summer Collection" class="hero__image img-fluid">
                </div>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
